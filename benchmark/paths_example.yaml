# Example path registry. Copy it, set the three roots, and point the CALF_PATHS environment variable at your copy.
# Keys are read by benchmark/core/farm_paths.py.
version: 1
created: "2026-10-09"
roots:
  volume: "/path/to/your/storage"
  mount: "/path/to/your/videos"
  mount_uri: "file:/path/to/your/videos"
layout: original
days:
  train: ["20240418", "20240419"]
  val: ["20240422", "20240423"]
  test: ["20240424", "20240425", "20240426", "20240427", "20240428"]
datasets:
  edinburgh_pigs:
    root: {space: volume, path: datasets/edinburgh_pigs}
    annotated: {space: volume, path: datasets/edinburgh_pigs/annotated}
    decoded_frames: {space: volume, path: datasets/edinburgh_pigs/decoded_frames}
    initial_prompts: {space: volume, path: datasets/edinburgh_pigs/initial_prompts}
  pigtrack:
    root: {space: volume, path: datasets/pigtrack}
    raw: {space: volume, path: datasets/pigtrack/raw}
    sequences: {space: volume, path: datasets/pigtrack/sequences, per_split: true}
    seqmaps: {space: volume, path: datasets/pigtrack/seqmaps}
    split_file: {space: volume, path: datasets/pigtrack/split.txt}
  calves:
    videos: {space: mount, path: calves/Videos, read_only: true}
models:
  student_edinburgh: {space: volume, path: models/sam3_student_tinyvit/edinburgh_ema_ep75/best_backbone_student.pt}
  student_pigtrack: {space: volume, path: models/sam3_student_tinyvit/pigtrack_v2_dp01/best_backbone_student_pigtrack.pt}
  student_calf: {space: volume, path: models/sam3_student_tinyvit/calf_night_mined/best_backbone_student_v2.pt, sha256: ebf7a771bd5ac853ec1a44f209e5efe97bbdd4436a12c758d901634e2660376d}
  detector_pig_pt: {space: volume, path: models/rfdetr_box_pig/d_pt_v1}
  detector_pig_edi: {space: volume, path: models/rfdetr_box_pig/d_edi_v1}
  detector_segv1d: {space: volume, path: models/rfdetr_seg_calf/segv1d_r624/checkpoint_best_total.pth}
  es3_trunk: {space: volume, path: models/baselines/es3_trunk_tinyvit_l.pt}
paper1:
  root: {space: volume, path: paper1_distillation}
  bench: {space: volume, path: paper1_distillation/bench}
  detector_runs: {space: volume, path: paper1_distillation/detector_runs}
  distillation_runs: {space: volume, path: paper1_distillation/distillation_runs}
  efficiency: {space: volume, path: paper1_distillation/efficiency}
  scores: {space: volume, path: paper1_distillation/scores}
  calf_windows_protocol: {space: volume, path: paper1_distillation/protocol/calf_windows_v1.json}
  calf_windows_gt_pins: {"20240422": 0422-S, "20240423": 0423-S}
  teacher_targets:
    edinburgh: {space: volume, path: paper1_distillation/teacher_targets/edinburgh}
    pigtrack_train: {space: volume, path: paper1_distillation/teacher_targets/pigtrack_train}
